# ============================================================
# 优化后的 printer.cfg - 适用于 Buildroot + uClibc 环境
# 修改日期：2026-05-21
# ============================================================

# --------------------- MCU 定义 ----------------------------
[mcu]
serial: /dev/ttyS3
baud: 230400
restart_method: command
# log_stats: False

[mcu eboard]
serial: /dev/ttyS4
baud: 230400
restart_method: command
# log_stats: False

# # 定义 Linux 主机为辅助 MCU
# [mcu host]
# serial: /tmp/klipper_host_mcu

# --------------------- 步进电机 X --------------------------
[stepper_x]
step_pin: PC1
dir_pin: PC0
enable_pin: !PA1
microsteps: 16
rotation_distance: 40
endstop_pin: !eboard:PA15
position_endstop: 110
position_max: 110.1
position_min: -110
homing_speed: 25
homing_retract_dist: 5
homing_retract_speed: 25
second_homing_speed: 2.5

# --------------------- 步进电机 Y --------------------------
[stepper_y]
step_pin: PA3
dir_pin: PA2
enable_pin: !PA6
microsteps: 16
rotation_distance: 40
endstop_pin: !eboard:PA13
position_endstop: 110
position_max: 110.1
position_min: -110
homing_speed: 25
homing_retract_dist: 5
homing_retract_speed: 25
second_homing_speed: 2.5

# --------------------- 步进电机 Z --------------------------
[stepper_z]
step_pin: PC4
dir_pin: PA7
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: PB15
position_endstop: 220
position_max: 230
position_min: -10
homing_speed: 25
homing_retract_dist: 5
homing_retract_speed: 12.5
second_homing_speed: 2.5

# --------------------- 挤出机 ------------------------------
[extruder]
step_pin: eboard:PB14
dir_pin: !eboard:PB15
enable_pin: !eboard:PB12
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: eboard:PA8
sensor_type: Generic 3950
sensor_pin: eboard:PA0
min_temp: -100
max_temp: 350
pressure_advance: 0.035
pressure_advance_smooth_time: 0.040
max_extrude_only_distance: 1500.00
max_extrude_cross_section: 1000
rotation_distance: 4.4
control: pid
pid_kp: 33.443
pid_ki: 4.372
pid_kd: 63.961

# 可选：用于控制热端总电源开关（如固态继电器），如不需要可删除此模块
[output_pin extruder_heater]
pin: eboard:PB7
value: 1
shutdown_value: 0

[gcode_macro EXTRUDER_ON]
gcode:
  SET_PIN PIN=extruder_heater VALUE=1

[gcode_macro EXTRUDER_OFF]
gcode:
  SET_PIN PIN=extruder_heater VALUE=0

# --------------------- 热床 --------------------------------
[heater_bed]
heater_pin: PB9
sensor_type: Generic 3950
sensor_pin: PC3
pullup_resistor: 4700
min_temp: -100
max_temp: 130
control: pid
pid_kp: 74.793
pid_ki: 1.619
pid_kd: 863.863

# --------------------- 加热器保护 --------------------------
[verify_heater extruder]
max_error: 290
check_gain_time: 200
hysteresis: 10
heating_gain: 10

[verify_heater heater_bed]
max_error: 120
check_gain_time: 200
hysteresis: 10
heating_gain: 10

# --------------------- LED 照明 ----------------------------
[led chamber_led]
white_pin: PA8
hardware_pwm: False
initial_white: 1

# --------------------- 风扇配置 ----------------------------
[heater_fan hotend_fan]
pin: eboard:PB4
max_power: 1.0
heater: extruder
heater_temp: 50.0

[fan]
pin: eboard:PB5

[fan_generic chamber_fan]
pin: PC6
hardware_pwm: True
enable_pin: PC7

# 明确指定 MCU 前缀，避免歧义
[controller_fan stepper_driver_fan]
pin: mcu:PB7      # 主 MCU 的 PB7
stepper: stepper_x, stepper_y, stepper_z
fan_speed: 0.8
idle_timeout: 0

[fan_generic internal_fan]
pin: PB6

[fan_generic external_fan]
pin: PB8

# --------------------- 按钮与电源管理 ----------------------
[gcode_button btn_power]
pin: !PC15
press_gcode:
    _SHUTDOWN_BUTTON_TRIGGER

[output_pin _power_off]
pin: PC14
value: 1
shutdown_value: 1

[output_pin _clear_power_off]
pin: PG1
value: 0
shutdown_value: 0

# --------------------- 加速度计 (ADXL345) ------------------
[adxl345]
cs_pin: eboard:PA4
spi_speed: 1000000
spi_software_sclk_pin: eboard:PA5
spi_software_mosi_pin: eboard:PA7
spi_software_miso_pin: eboard:PA6
axes_map: x, y, z
rate: 800

[resonance_tester]
accel_chip: adxl345
min_freq: 5
max_freq: 100
probe_points:
    0,0,100

# --------------------- 通用设置 ----------------------------
[idle_timeout]
timeout: 600

[pause_resume]
recover_velocity: 50
# 启用暂停/恢复功能
# retract_on_pause: 2.0  # 暂停时回抽耗材
# lift_z: 2.0            # 暂停时Z轴抬升
# speed: 50              # 移动速度

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
minimum_cruise_ratio: 0.5
max_z_velocity: 25
max_z_accel: 500
square_corner_velocity: 25

# --------------------- TMC2209 驱动 ------------------------
[tmc2209 stepper_x]
uart_pin: PC2
interpolate: True
run_current: 0.9
#hold_current:0.3
sense_resistor: 0.10
#stealthchop_threshold: 12000

[tmc2209 stepper_y]
uart_pin: PA4
interpolate: True
run_current: 0.9
#hold_current:0.3
sense_resistor: 0.10
#stealthchop_threshold: 12000

[tmc2209 stepper_z]
uart_pin: PC5
interpolate: True
run_current: 0.6
hold_current:0.6
sense_resistor: 0.10
#stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: eboard:PA14
interpolate: True
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.10
#stealthchop_threshold: 999999



# --------------------- 断料检测（需确认引脚空闲）-----------
# 注意：原 extruder 已占用 eboard:PB14，此处改用 eboard:PC13（假设空闲）
# 请根据实际接线修改引脚，若未连接可注释整个模块
[filament_switch_sensor runout_sensor]
pause_on_runout: False
switch_pin: !PB14
event_delay: 1.0
runout_gcode:
    _FILAMENT_RUNOUT_EVENT

# 保留原 E1 输入（未使用）
[gcode_button _e1_sensor_input]
pin: !PE1
press_gcode:
    G4 P0

# --------------------- 伺服舵机 ----------------------------
[servo my_servo]
pin: PC9
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 95

# --------------------- 其他功能 ----------------------------
[gcode_arcs]
resolution: 1.0

[firmware_retraction]
retract_length: 0.8
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35
  
[virtual_sdcard]
path: /root/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]
[exclude_object]
[respond]   # 支持 RESPOND 命令

# --------------------- 归零覆盖 ----------------------------
[homing_override]
gcode:
    M204 S5000
    G28 Z0
    G28 X0
    G28 Y0
    G90
    G1 X105 Y105 Z210 F1800

# --------------------- 涡流探头 (Eddy NG) ------------------
[probe_eddy_ng eboard_eddy_probe]
sensor_type: ldc1612
i2c_mcu: eboard                     # 你的 EBB42 在 Klipper 中的 MCU 名称
i2c_address: 42                     # 0x2A 的十进制形式
# i2c_bus: i2c2                       # 逻辑总线声明（必须存在）
i2c_software_scl_pin: eboard:PB10   # 启用内部上拉,软件 I2C 时钟引脚
i2c_software_sda_pin: eboard:PB11   # 启用内部上拉,软件 I2C 数据引脚
i2c_speed: 100000
# 偏移量必须根据实际安装位置精确测量！下面为示例值
x_offset: 0.0
y_offset: 0.1                     # 参考 Voron 标准支架，请务必实测
# z_offset: 2                       # 初始值，后续校准会覆盖
# 添加下面这一行（二选一，或同时写两个）
# reg_drive_current: 14
# tap_drive_current: 14
calibration_z_max: 8
tap_mode: butter          # 使用 butterworth 滤波，更抗噪
tap_threshold: 150         # 降低阈值
tap_speed: 1.0            # 降低下降速度，增加采样密度
tap_start_z: 5.0          # 从较低高度开始，减少无效行程
tap_target_z: -2.5        # 允许更深的下降
tap_butter_lowcut: 5.0    # 默认，可尝试 3.0
tap_butter_highcut: 25.0  # 默认
# allow_unsafe: True        # 允许跳过一些检查（可选）
# --- 调试选项 ---
debug: True

[bed_mesh]
speed: 200
horizontal_move_z: 2                # 探测时抬升高度
# 以下坐标需根据你的打印机实际行程和探头偏移量重新计算
mesh_min: -105, -65
mesh_max: 105, 105
probe_count: 10, 10
algorithm: bicubic

# --------------------- 调平螺丝辅助 ------------------------
[screws_tilt_adjust]
screw1: -94, -94
screw1_name: Left Near
screw2: 94, -94
screw2_name: Right Near
screw3: 94, 94
screw3_name: Right Far
screw4: -94, 94
screw4_name: Left Far
horizontal_move_z: 1
speed: 300
screw_thread: CW-M4

# ===================== 配置文件结束 ========================