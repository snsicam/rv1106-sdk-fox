[gcode_macro AIR_CIRCULATION_INTERNAL]
description: Turn on internal air circulation
gcode:
    SET_FAN_SPEED FAN=external_fan SPEED=0
    SET_FAN_SPEED FAN=internal_fan SPEED=1
    SET_SERVO SERVO=my_servo ANGLE=95

[gcode_macro AIR_CIRCULATION_EXTERNAL]
description: Turn on external air circulation
gcode:
    SET_FAN_SPEED FAN=external_fan SPEED=.8 ;dropped to 80 percent to quiet it down
    SET_FAN_SPEED FAN=internal_fan SPEED=1
    SET_SERVO SERVO=my_servo ANGLE=180

[gcode_macro AIR_CIRCULATION_STOP]
description: Turn off air circulation
gcode:
    SET_FAN_SPEED FAN=external_fan SPEED=0
    SET_FAN_SPEED FAN=internal_fan SPEED=0
    SET_SERVO SERVO=my_servo ANGLE=95

[gcode_macro M106]
rename_existing: M106.1
gcode:
    {% if params.P is defined and params.P|int > 0 %}
        {% if params.P|int == 1 %}
        RESPOND MSG="Fan does not exist!"
        {% endif %}
        {% if params.P|int == 2 %}
        SET_FAN_SPEED FAN=chamber_fan SPEED={(params.S|int / 255 )}
        {% endif %}
        {% if params.P|int == 3 %}
            SET_FAN_SPEED FAN=internal_fan SPEED={(params.S|int / 255 )}
            SET_FAN_SPEED FAN=external_fan SPEED={(params.S|int / 255 )}
            {% if params.S|int == 0 %}
                SET_SERVO SERVO=my_servo ANGLE=95
            {% else %}
                SET_SERVO SERVO=my_servo ANGLE=180
            {% endif %}
        {% endif %}
    {% else %}
        M106.1 S{params.S|int}
    {% endif %}

[gcode_macro WRITE_PRINTER_CONFIG]
description: 直接写入 printer.cfg 配置文件
gcode:
    {% set content = params.CONTENT %}
    {% set f = open("/home/pi/printer_data/config/printer.cfg", "a") %}
    {% set _ = f.write("\n" ~ content ~ "\n") %}
    {% set _ = f.close() %}
    RESPOND MSG="✅ 配置已写入 printer.cfg"

[gcode_macro APPLY_SHAPER_AND_SAVE]
description: 应用输入整形并写入 printer.cfg
gcode:
    {% set s_x = params.SHAPER_TYPE_X|default("mzv")|string %}
    {% set f_x = params.SH_FREQ_X|default(50.0)|float %}
    {% set s_y = params.SHAPER_TYPE_Y|default("mzv")|string %}
    {% set f_y = params.SHAPER_FREQ_Y|default(50.0)|float %}

    # 临时生效
    SET_INPUT_SHAPER SHAPER_TYPE_X={s_x} SHAPER_FREQ_X={f_x} SHAPER_TYPE_Y={s_y} SHAPER_FREQ_Y={f_y}

    RESPOND MSG="✅ 输入整形已应用"
    RESPOND MSG="X: {s_x} {f_x}"
    RESPOND MSG="Y: {s_y} {f_y}"

    # 直接写入 printer.cfg（你的真实路径）
    {% set cfg = "[input_shaper]\n"
                 "shaper_type_x: " ~ s_x ~ "\n"
                 "shaper_freq_x: " ~ "%.1f"|format(f_x) ~ "\n"
                 "shaper_type_y: " ~ s_y ~ "\n"
                 "shaper_freq_y: " ~ "%.1f"|format(f_y) ~ "\n" %}

    # 调用写入宏
    WRITE_PRINTER_CONFIG CONTENT={cfg}

    RESPOND MSG="✅ 已永久写入 printer.cfg"
    RESPOND MSG="🔁 现在重启生效"

    #RESTART   
