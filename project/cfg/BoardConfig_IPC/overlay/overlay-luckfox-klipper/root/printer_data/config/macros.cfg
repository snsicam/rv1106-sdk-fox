# ## Shutdown commands
# [gcode_shell_command stop-and-sync]
# command: sh -c /usr/libexec/shutdown
# timeout: 15
# verbose: True

# [gcode_shell_command shutdown-ad5m]
# command: systemctl poweroff
# timeout: 15
# verbose: False

[gcode_macro SHUTDOWN]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Question"
    RESPOND TYPE=command MSG="action:prompt_text Klipper Mod will shutdown. This will end any active prints. Are you sure?"
    RESPOND TYPE=command MSG="action:prompt_footer_button Abort|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Shutdown|_SHUTDOWN_STAGE|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _POWER_OFF]
gcode:
    SET_PIN PIN=_power_off VALUE=0

[gcode_macro _SHUTDOWN_BUTTON_TRIGGER]
variable_trigger_allowed: False
gcode:
    {% if trigger_allowed %}
        # Reset button state, otherwise only one trigger can occur
        SET_PIN PIN=_clear_power_off VALUE=1
        # There is a deboucing circuit which needs some delay
        G4 P500
        # Disable pin again otherwise on reset the button will be triggered 1-3 times
        SET_PIN PIN=_clear_power_off VALUE=0
        RESPOND TYPE=error MSG="Shutdown triggered by button"
        SHUTDOWN
    {% endif %}

[delayed_gcode _PRO_BUTTON_BOUNCE_GUARD]
# Guard is needed as the button might trigger 0-2 times on RESTART
initial_duration: 1
gcode:
    SET_GCODE_VARIABLE MACRO=_SHUTDOWN_BUTTON_TRIGGER VARIABLE=trigger_allowed VALUE=True


[gcode_macro _SHUTDOWN_STAGE]
gcode:
# remove promt as sometimes it gets stuck in fluidd
    RESPOND TYPE=command MSG=action:prompt_end
    RUN_SHELL_COMMAND CMD=stop-and-sync
# power off will not do anything on a ad5m non pro
    _POWER_OFF
    RUN_SHELL_COMMAND CMD=shutdown-ad5m

[gcode_macro AUTO_SHUTDOWN]
gcode:
  UPDATE_DELAYED_GCODE ID=AUTO_SHUTDOWN_CHECK DURATION=30
    

[delayed_gcode AUTO_SHUTDOWN_CHECK]
gcode:
  {% if printer.idle_timeout.state == "Idle" or printer.idle_timeout.state == "Ready" %}
    {% if printer.extruder.temperature < 50.0 and printer.heater_bed.temperature < 50.0 %}
        {% if printer.extruder.target == 0.0 and printer.heater_bed.target == 0.0 %}
            UPDATE_DELAYED_GCODE ID=AUTO_SHUTDOWN_CHECK DURATION=0
            _SHUTDOWN_STAGE
        {% else %}
            UPDATE_DELAYED_GCODE ID=AUTO_SHUTDOWN_CHECK DURATION=2
        {% endif %}
    {% else %}
        {% if printer.idle_timeout.state == "Printing" %}
            UPDATE_DELAYED_GCODE ID=AUTO_SHUTDOWN_CHECK DURATION=0
        {% else %}
            {% if printer.extruder.target == 0.0 and printer.heater_bed.target == 0.0 %}
                UPDATE_DELAYED_GCODE ID=AUTO_SHUTDOWN_CHECK DURATION=2
            {% else %}
                UPDATE_DELAYED_GCODE ID=AUTO_SHUTDOWN_CHECK DURATION=0
            {% endif %}
        {% endif %}
    {% endif %}
  {% endif %}

[gcode_macro CLEAN_NOZZLE]
gcode:
  {% set BED_TEMP = params.BED|default(60)|float %}
  M140 S{BED_TEMP}        # No Wait

  G28 X0 Y0 F1500

  # 获取当前目标温度，提供默认值 0
  {% set target_temp = printer.extruder.target|default(0)|float %}
  
  # 根据目标温度决定擦嘴温度
  {% if target_temp <= 220 %}
    {% set PROBE_TEMP = 150 %}
  {% elif target_temp <= 250 %}
    {% set PROBE_TEMP = 175 %}
  {% elif target_temp <= 280 %}
    {% set PROBE_TEMP = 200 %}
  {% else %}
    {% set PROBE_TEMP = 220 %}
  {% endif %}

  # 如果目标温度为0（未加热），则使用默认150度
  {% if target_temp < 1 %}
    {% set PROBE_TEMP = 150 %}
  {% endif %}

  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={PROBE_TEMP}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={PROBE_TEMP}

  G28 Z0 F1200
  M104 S{target_temp}
  G91
  G0 Z5 F1200
  G90
  G0 X0 Y100 F1200
  G0 Z2.5 F600

  # 擦嘴动作（已启用）
  G91
  G0 F3000
  G1 X+0 Y+1 Z-0.1
  G1 X+5 Y-3 Z-0.5
  G1 X+5 Y+3 Z+0.5
  G1 X+5 Y-3 Z-0.5
  G1 X+5 Y+3 Z+0.5
  G1 X+5 Y-3 Z-0.5
  G1 X+5 Y+3 Z+0.5
  G1 X+5 Y-3 Z-0.5
  G1 X-5 Y-5 Z+0.5
  G1 X-5 Y+8 Z-0.5
  G1 X-5 Y-8 Z+0.5
  G1 X-5 Y+8 Z-0.5
  G1 X-5 Y-8 Z+0.5
  G1 X-5 Y+8 Z-0.5
  G1 X-5 Y-8 Z+0.5
  G1 X-5 Y+8 Z-0.5
  G90

  G0 X0 Y0 Z10 F3000
[gcode_macro START_SPEED_TEST]
description: 方形速度测试（自动归零+加热+清洁喷嘴+挤出，第一层固定200mm/s）
gcode:
    # ========== 1. 获取用户参数（安全转换） ==========
    {% set SPEED = params.SPEED|default(150)|float %}               # 第二层及之后的速度
    {% set LAYERS = params.LAYERS|default(5)|int %}                 # 总层数
    {% set BED_TEMP = params.BED_TEMP|default(0)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(0)|float %}

    # 参数合法性检查
    {% if LAYERS < 1 %}{% set LAYERS = 1 %}{% endif %}
    {% if SPEED < 10 %}{% set SPEED = 10 %}{% endif %}

    # ========== 2. 几何参数 ==========
    {% set SIZE = 200 %}
    {% set START_X = 100 %}
    {% set START_Y = 100 %}
    {% set LAYER_HEIGHT = 0.2 %}
    {% set LINE_WIDTH = 0.4 %}
    {% set FILAMENT_DIA = 1.75 %}
    {% set EXTRUDE_MULTIPLIER = 1.0 %}

    # 挤出计算
    {% set FILAMENT_AREA = 3.1415926 * (FILAMENT_DIA / 2) ** 2 %}
    {% set EXTRUDE_PER_MM = (LAYER_HEIGHT * LINE_WIDTH) / FILAMENT_AREA * EXTRUDE_MULTIPLIER %}

    # 正方形的四个顶点
    {% set POINTS = [
        (START_X, START_Y),
        (START_X - SIZE, START_Y),
        (START_X - SIZE, START_Y - SIZE),
        (START_X, START_Y - SIZE),
        (START_X, START_Y)
    ] %}
    {% set EDGE_LEN = SIZE %}

    # ========== 3. 归零 ==========
    {% set homed = printer.toolhead.homed_axes|lower %}
    {% if "xyz" not in homed %}
        M117 Homing...
        G28
    {% else %}
        M117 Already homed
    {% endif %}

    # ========== 4. 加热 ==========
    {% if BED_TEMP > 0 %}
        M117 Heating bed to {BED_TEMP}...
        M140 S{BED_TEMP}
        M190 S{BED_TEMP}
    {% endif %}

    {% if EXTRUDER_TEMP > 0 %}
        M117 Heating nozzle to {EXTRUDER_TEMP}...
        M104 S{EXTRUDER_TEMP}
        M109 S{EXTRUDER_TEMP}
    {% endif %}

    # ========== 5. 清洁喷嘴 ==========
    M117 Cleaning nozzle...
    CLEAN_NOZZLE
    M117 Cleaning done

    # ========== 6. 开始打印 ==========
    M117 Speed test: layer1 200mm/s, others {SPEED}mm/s, {LAYERS} layers

    G90
    G1 Z5 F600
    G1 X{START_X} Y{START_Y} F6000
    G1 Z{LAYER_HEIGHT} F300
    M83

    {% set total_extrude = 0.0 %}

    {% for layer in range(LAYERS) %}
        {% if layer == 0 %}
            {% set current_speed = 200 %}
        {% else %}
            {% set current_speed = SPEED %}
        {% endif %}

        M117 Layer {layer+1}/{LAYERS} speed {current_speed}mm/s

        G1 Z{LAYER_HEIGHT * (layer + 1)} F300

        # 正方形四条边（挤出）
        G1 X{POINTS[1][0]} Y{POINTS[1][1]} F{current_speed * 60} E{EDGE_LEN * EXTRUDE_PER_MM}
        G1 X{POINTS[2][0]} Y{POINTS[2][1]} F{current_speed * 60} E{EDGE_LEN * EXTRUDE_PER_MM}
        G1 X{POINTS[3][0]} Y{POINTS[3][1]} F{current_speed * 60} E{EDGE_LEN * EXTRUDE_PER_MM}
        G1 X{POINTS[4][0]} Y{POINTS[4][1]} F{current_speed * 60} E{EDGE_LEN * EXTRUDE_PER_MM}

        {% set total_extrude = total_extrude + 4 * EDGE_LEN * EXTRUDE_PER_MM %}

        {% if layer < LAYERS - 1 %}
            G1 Z{LAYER_HEIGHT * (layer + 2)} F300
        {% endif %}
    {% endfor %}

    # 结束
    G1 E-2.0 F300
    G4 P200
    G90
    G1 Z10 F600
    G28 X Y
    M117 Done, total extrude {total_extrude|round(1)} mm

[gcode_macro STOP_SPEED_TEST]
description: 停止速度测试（含挤出急停）
gcode:
    M117 紧急停止测试...
    M410                    # 立即停止所有运动（包括挤出）
    G91                     # 相对定位
    G1 Z10 F600             # Z抬起
    G1 E-2 F300             # 回抽2mm，防止漏料
    G90                     # 恢复绝对定位
    G28 X Y                 # 归位XY
    M117 测试已停止

[gcode_macro GET_EDDY_FREQUENCY]
gcode:
    RESPOND TYPE=command MSG="Eddy Probe Status:"
    RESPOND TYPE=command MSG="Current Frequency: {printer['temperature_sensor eddy_frequency'].temperature} Hz"

[gcode_macro EDDY_AUTO_CALIBRATE]
description: 涡流检测校准
gcode:
   G90
   G0 X0 Y0 Z10 F1200
   PROBE_EDDY_NG_TAP 
   G90
   G0 X0 Y0 Z10 F1200
   PROBE_EDDY_AUTO_CALIBRATE
   M117 涡流检测校准完成
    

    
    